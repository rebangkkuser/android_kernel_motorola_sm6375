name: Build Kernel (BakaSU + SUSFS + Droidspaces)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_DEFCONFIG: vendor/holi-qgki_defconfig
  KERNEL_IMAGE: arch/arm64/boot/Image
  KSU_REPO: https://github.com/Baka-SU/BakaSU.git
  KSU_COMMIT: 7b65bde0710b5e7c6f755545cb15a4abd417f3a8
  AK3_REPO: https://github.com/samw662/AnyKernel3.git
  AK3_BRANCH: bangkk
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz
  CLANG_DIR: ${{ github.workspace }}/.toolchain/clang-r416183b

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip lz4 \
            build-essential python3 git curl ca-certificates

      - name: Cache AOSP clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: aosp-clang-r416183b-v1

      - name: Download AOSP clang
        run: |
          set -euo pipefail
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            mkdir -p "$CLANG_DIR"
            curl -fL --retry 3 --retry-delay 5 -o /tmp/clang.tar.gz "$CLANG_URL"
            tar -xzf /tmp/clang.tar.gz -C "$CLANG_DIR"
            rm -f /tmp/clang.tar.gz
          fi
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version

      - name: Prepare KernelSU
        run: |
          set -euo pipefail
          rm -rf KernelSU
          git init -q KernelSU
          git -C KernelSU remote add origin "$KSU_REPO"
          git -C KernelSU fetch -q --depth 1 origin "$KSU_COMMIT"
          git -C KernelSU checkout -q FETCH_HEAD
          git -C KernelSU log -1 --oneline
          if [ ! -e drivers/kernelsu ]; then
            ln -s ../KernelSU/kernel drivers/kernelsu
          fi
          grep -q 'kernelsu/' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            awk '{ lines[NR]=$0; if ($0 ~ /^endmenu$/) last=NR } END { for (i=1;i<=NR;i++) { if (i==last) print "source \"drivers/kernelsu/Kconfig\""; print lines[i] } }' drivers/Kconfig > /tmp/drivers.Kconfig
            mv /tmp/drivers.Kconfig drivers/Kconfig
          fi

      - name: Generate defconfig
        env:
          TARGET_PRODUCT: bangkk
          TARGET_BUILD_VARIANT: user
          LLVM: "1"
          HOSTCC: gcc
          HOSTCXX: g++
          LD: ld.lld
        run: |
          set -euo pipefail
          bash scripts/gki/generate_defconfig.sh vendor/holi-qgki_defconfig
          rm -f .config defconfig
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 HOSTCC=gcc HOSTCXX=g++ LOCALVERSION= \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            "$KERNEL_DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/ext_config/lineage_moto-holi.config
          scripts/config --file out/.config -d CC_WERROR
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 HOSTCC=gcc HOSTCXX=g++ LOCALVERSION= \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            olddefconfig
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config
          grep -q '^CONFIG_OVERLAY_FS=y' out/.config
          grep -q '^CONFIG_USER_NS=y' out/.config
          grep -q '^CONFIG_MEMCG_SWAP=y' out/.config
          grep -q '^CONFIG_QCA_CLD_WLAN=m' out/.config
          grep -q '^CONFIG_EXFAT_FS=m' out/.config
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' out/.config
          grep -q '^CONFIG_LOCALVERSION="-MewiKernel"' out/.config
          REL="$(make -s O=out ARCH=arm64 LLVM=1 HOSTCC=gcc HOSTCXX=g++ LOCALVERSION= kernelrelease)"
          echo "kernelrelease: $REL"
          [ "$REL" = "5.4.302-MewiKernel" ] || { echo "::error::unexpected kernelrelease: $REL"; exit 1; }
          echo "REL=$REL" >> "$GITHUB_ENV"

      - name: Build kernel, dtbs and modules
        run: |
          set -euo pipefail
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 HOSTCC=gcc HOSTCXX=g++ LOCALVERSION= \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            Image dtbs modules
          ls -lh "out/$KERNEL_IMAGE"
          find out/arch/arm64/boot/dts/vendor/qcom -maxdepth 1 \( -name '*.dtb' -o -name '*.dtbo' \) | wc -l

      - name: Install modules
        run: |
          set -euo pipefail
          rm -rf modstage modflat
          mkdir -p modstage modflat
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 HOSTCC=gcc HOSTCXX=g++ LOCALVERSION= \
            INSTALL_MOD_PATH="$PWD/modstage" INSTALL_MOD_STRIP=1 \
            modules_install
          test -d "modstage/lib/modules/$REL"
          ls "modstage/lib/modules/$REL" | head

      - name: Collect DTBs/DTBOs
        run: |
          set -euo pipefail
          mkdir -p dtbs
          find out/arch/arm64/boot/dts/vendor/qcom -maxdepth 1 \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp {} dtbs/ \;
          ls -lh dtbs | head

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b "$AK3_BRANCH" "$AK3_REPO" AnyKernel3
          rm -rf AnyKernel3/.git
          cp "out/$KERNEL_IMAGE" AnyKernel3/Image
          cd AnyKernel3
          bash place-modules.sh "$GITHUB_WORKSPACE/modstage/lib/modules/$REL" "$GITHUB_WORKSPACE/modflat" "/vendor/lib/modules"
          sed -i "s@^kernel.string=.*@kernel.string=MewiKernel 5.4.302 | BakaSU+SUSFS+Droidspaces (${GITHUB_SHA::7})@" anykernel.sh
          ZIP_NAME="MewiKernel-bangkk-${GITHUB_SHA::7}.zip"
          zip -q -r9 "../$ZIP_NAME" .
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lh "$ZIP_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload dtbs/dtbos
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-bangkk-${{ github.sha }}
          path: dtbs/
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
